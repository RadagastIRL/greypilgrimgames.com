<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulators & Management Games — Grey Pilgrim Games</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root,
    [data-theme="light"] {
      --bg:           #f0ece2;
      --surface:      #faf7f2;
      --surface2:     #e8e3d8;
      --border:       #cfc9bc;
      --text:         #2c2416;
      --text-muted:   #7a6e5c;
      --gold:         #7a5a10;
      --gold-dim:     #a07828;
      --shadow:       rgba(0,0,0,0.08);
      --radius: 8px;
      --font: 'Georgia', serif;
      --font-ui: system-ui, sans-serif;
    }

    [data-theme="dark"] {
      --bg:           #0e0e12;
      --surface:      #1a1a24;
      --surface2:     #23232f;
      --border:       #33334a;
      --text:         #d4c4a8;
      --text-muted:   #7a7090;
      --gold:         #c8a84b;
      --gold-dim:     #8a7232;
      --shadow:       rgba(0,0,0,0.5);
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="os"] {
        --bg:           #0e0e12;
        --surface:      #1a1a24;
        --surface2:     #23232f;
        --border:       #33334a;
        --text:         #d4c4a8;
        --text-muted:   #7a7090;
        --gold:         #c8a84b;
        --gold-dim:     #8a7232;
        --shadow:       rgba(0,0,0,0.5);
      }
    }
    @media (prefers-color-scheme: light) {
      [data-theme="os"] {
        --bg:           #f0ece2;
        --surface:      #faf7f2;
        --surface2:     #e8e3d8;
        --border:       #cfc9bc;
        --text:         #2c2416;
        --text-muted:   #7a6e5c;
        --gold:         #7a5a10;
        --gold-dim:     #a07828;
        --shadow:       rgba(0,0,0,0.08);
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
      transition: background 0.2s, color 0.2s;
    }

    nav {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    nav a {
      font-family: var(--font-ui);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
    }

    nav a:hover { color: var(--gold); }

    #theme-bar {
      display: inline-flex;
      gap: 0.25rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.25rem;
    }

    #theme-bar button {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 16px;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    #theme-bar button.active { background: var(--gold); color: var(--surface); }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      width: 100%;
      max-width: 640px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    header p {
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    .section-label {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      width: 100%;
      max-width: 640px;
      margin-bottom: 0.6rem;
    }

    .card-list {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 1px 4px var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    a.card:hover {
      border-color: var(--gold-dim);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .card-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
      width: 2.4rem;
      text-align: center;
    }

    .card-body { flex: 1; }

    .card-title {
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .card-desc {
      font-family: var(--font-ui);
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .card-arrow {
      font-size: 1rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .card.soon {
      opacity: 0.55;
      cursor: default;
    }

    .card.soon .card-title::after {
      content: 'Coming soon';
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold-dim);
      margin-left: 0.6rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<nav>
  <a href="/">← Grey Pilgrim Games</a>
  <div id="theme-bar">
    <button data-theme="light" class="active">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="os">OS</button>
  </div>
</nav>

<header>
  <h1>Simulators &amp; Management Games</h1>
  <p>Guides, calculators, and trackers for your favorite sim and management games.</p>
</header>

<div class="section-label">In development</div>
<div class="card-list">
  <a class="card" href="/simulators/planet-zoo/">
    <div class="card-icon">🦁</div>
    <div class="card-body">
      <div class="card-title">Planet Zoo</div>
      <div class="card-desc">Species requirement references and habitat bonus trackers.</div>
    </div>
    <div class="card-arrow">→</div>
  </a>
  <div class="card soon">
    <div class="card-icon">🌱</div>
    <div class="card-body">
      <div class="card-title">Stardew Valley</div>
      <div class="card-desc">Optimization calculators and planning tools.</div>
    </div>
  </div>
</div>

<script>
  const themeButtons = document.querySelectorAll('#theme-bar button');

  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem('gpg-wow-theme', theme);
    themeButtons.forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
  }

  themeButtons.forEach(btn => btn.addEventListener('click', () => setTheme(btn.dataset.theme)));
  setTheme(localStorage.getItem('gpg-wow-theme') || 'light');
</script>
</body>
</html>
